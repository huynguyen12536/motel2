name: FE CD

on:
  push:
    tags:
      - "v*.*.*"
  # Validation/debug only — never publishes images or the prod alias.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/huynguyen12536/apa_nano_fe

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch origin/develop
        run: git fetch --no-tags origin develop:refs/remotes/origin/develop

      - name: Validate semantic release tag
        id: tag
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch is validation-only and does not publish to GHCR."
            if [[ ! "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "Dispatch validation complete (non-tag ref). Skipping publish job."
              echo "release_tag=" >> "$GITHUB_OUTPUT"
              echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '${TAG_NAME}'. Expected vMAJOR.MINOR.PATCH (e.g. v0.1.0)."
            exit 1
          fi

          echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "Validated release tag: ${TAG_NAME}"

      - name: Validate tag commit belongs to origin/develop
        if: steps.tag.outputs.release_tag != ''
        run: |
          set -euo pipefail

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/develop; then
            echo "::error::Tag commit ${GITHUB_SHA} is not an ancestor of origin/develop. Release tags must point at commits already on develop."
            exit 1
          fi

          echo "Tag commit ${GITHUB_SHA} is contained in origin/develop."

  publish:
    name: publish-ghcr
    needs: validate
    if: github.event_name == 'push' && needs.validate.outputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve public build-time configuration
        id: build_config
        run: |
          set -euo pipefail

          # Prefer repository Variables; fall back to documented demo-safe defaults.
          # These are public NEXT_PUBLIC_* values, not secrets.
          APP_NAME="${{ vars.NEXT_PUBLIC_APP_NAME }}"
          API_URL="${{ vars.NEXT_PUBLIC_API_URL }}"
          DEMO_MODE="${{ vars.NEXT_PUBLIC_DEMO_MODE }}"
          API_CREDENTIALS="${{ vars.NEXT_PUBLIC_API_CREDENTIALS }}"

          APP_NAME="${APP_NAME:-WMS APA Nano}"
          API_URL="${API_URL:-http://localhost:8080/api/v1}"
          DEMO_MODE="${DEMO_MODE:-true}"
          API_CREDENTIALS="${API_CREDENTIALS:-true}"

          if [ "$DEMO_MODE" != "true" ] && [ "$DEMO_MODE" != "false" ]; then
            echo "::error::NEXT_PUBLIC_DEMO_MODE must be 'true' or 'false' (got '${DEMO_MODE}')."
            exit 1
          fi

          if [ "$API_CREDENTIALS" != "true" ] && [ "$API_CREDENTIALS" != "false" ]; then
            echo "::error::NEXT_PUBLIC_API_CREDENTIALS must be 'true' or 'false' (got '${API_CREDENTIALS}')."
            exit 1
          fi

          if [ "$DEMO_MODE" != "true" ] && [[ "$API_URL" == http://localhost* || "$API_URL" == http://127.0.0.1* ]]; then
            echo "::error::Non-demo production images must not bake a localhost NEXT_PUBLIC_API_URL. Set repository variable NEXT_PUBLIC_API_URL to a real public API base URL, or keep NEXT_PUBLIC_DEMO_MODE=true."
            exit 1
          fi

          {
            echo "app_name=${APP_NAME}"
            echo "api_url=${API_URL}"
            echo "demo_mode=${DEMO_MODE}"
            echo "api_credentials=${API_CREDENTIALS}"
          } >> "$GITHUB_OUTPUT"

          echo "Using build-time public config:"
          echo "  NEXT_PUBLIC_APP_NAME=${APP_NAME}"
          echo "  NEXT_PUBLIC_API_URL=${API_URL}"
          echo "  NEXT_PUBLIC_DEMO_MODE=${DEMO_MODE}"
          echo "  NEXT_PUBLIC_API_CREDENTIALS=${API_CREDENTIALS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.release_tag }}
            type=raw,value=prod
            type=raw,value=sha-${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/huynguyen12536/APA_Nano_FE
            org.opencontainers.image.title=APA Nano FE
            org.opencontainers.image.description=WMS APA Nano frontend production image
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ steps.build_config.outputs.app_name }}
            NEXT_PUBLIC_API_URL=${{ steps.build_config.outputs.api_url }}
            NEXT_PUBLIC_DEMO_MODE=${{ steps.build_config.outputs.demo_mode }}
            NEXT_PUBLIC_API_CREDENTIALS=${{ steps.build_config.outputs.api_credentials }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
