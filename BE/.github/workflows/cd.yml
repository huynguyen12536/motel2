name: BE CD

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: be-production-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/huynguyen12536/apa_nano_be

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release and develop ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Expected vMAJOR.MINOR.PATCH'; exit 1; }
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          commit=$(git rev-parse "HEAD^{commit}")
          git merge-base --is-ancestor "$commit" origin/develop || { echo '::error::Release commit must belong to develop'; exit 1; }
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
      - name: Protect immutable release tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          package = os.environ['IMAGE_NAME'].removeprefix('ghcr.io/')
          auth = base64.b64encode((os.environ['REGISTRY_USER'] + ':' + os.environ['GHCR_TOKEN']).encode()).decode()
          req = urllib.request.Request('https://ghcr.io/token?service=ghcr.io&scope=repository:' + package + ':pull', headers={'Authorization': 'Basic ' + auth})
          with urllib.request.urlopen(req) as response:
              token = json.load(response)['token']
          req = urllib.request.Request('https://ghcr.io/v2/' + package + '/manifests/' + os.environ['RELEASE_TAG'], method='HEAD', headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json'})
          try:
              urllib.request.urlopen(req).close()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit('Cannot safely verify release tag (registry HTTP ' + str(error.code) + ')')
          else:
              raise SystemExit('Release tag already exists; refusing to overwrite it')
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}
            type=raw,value=prod
          labels: |
            org.opencontainers.image.source=https://github.com/huynguyen12536/APA_Nano_BE
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
