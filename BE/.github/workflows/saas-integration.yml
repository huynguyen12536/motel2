name: SaaS isolated integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saas-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  saas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/run-saas-ci.mjs
