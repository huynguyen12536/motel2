name: motel
services:
  frontend:
    profiles:
      - full
    build:
      context: ./FE
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Workspace}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
        NEXT_PUBLIC_API_CREDENTIALS: ${NEXT_PUBLIC_API_CREDENTIALS:-true}
    env_file:
      - path: ./FE/.env.example
        required: true
      - path: ./FE/.env
        required: false
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/auth/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  api:
    build:
      context: ./BE
      target: runtime
    init: true
    env_file:
      - path: ./BE/.env
        required: false
    environment:
      NODE_ENV: production
      NEON_API_KEY: ""
      APP_PORT: 8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      DATABASE_VERIFY: ${DATABASE_VERIFY:-false}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    networks: [infrastructure]
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.APP_PORT||process.env.PORT||8080)+'/'+(process.env.API_PREFIX||'api/v1')+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./BE/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [infrastructure]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  redis:
    image: redis:8-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redis_data:/data]
    networks: [infrastructure]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  authorization-init:
    profiles: [authorization-init]
    image: motel-auth-init
    build:
      context: ./BE
      target: worker
    env_file:
      - path: ./BE/.env.auth-init
        required: true
    command: [node, dist/src/operations/authorization-init.main.js]
    networks: [infrastructure]
    restart: "no"
    init: true
networks:
  infrastructure:
    driver: bridge
volumes:
  rabbitmq_data:
    external: true
    name: motel-phase1_rabbitmq_data
  redis_data:
    external: true
    name: motel-phase1_redis_data
